# This is a basic workflow to help you get started with Actions

name: AKS Deployment

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:   # <-- adds a manual "Run workflow" button

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: self-hosted
    #runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        # SDK version to use. Examples: 2.2.104, 3.1, 3.1.x
        dotnet-version: 3.1.x

      # Optional package source for which to set up authentication. Will consult any existing NuGet.config in the root of the repo and provide a temporary NuGet.config using the NUGET_AUTH_TOKEN environment variable as a ClearTextPassword
    - name: dotnet build
      run: dotnet build -c release
    
    - name: docker build
      run: docker build -t githubactions-aks-demo:'${{github.sha}}' .
    
    - name: docker login
      run: docker login --username '${{secrets.DOCKER_LOGIN}}' --password '${{secrets.DOCKER_PASSWORD}}'
      
    - name: tag docker image        # <-- this is just a label for the step in the UI
      # run: docker tag githubactions-aks-demo:${{ github.sha }} ${{ secrets.DOCKER_LOGIN }}/githubactions-aks-demo:${{ github.sha }}
      run: docker tag "githubactions-aks-demo:${{ github.sha }}" "${{ secrets.DOCKER_LOGIN }}/githubactions-aks-demo:${{ github.sha }}"

    - name: push docker image
      run: docker push ${{ secrets.DOCKER_LOGIN }}/githubactions-aks-demo:${{ github.sha }}
      
    - name: Create secret in Kubernetes cluster
      run: |
        kubectl create secret docker-registry docker-image-pull-secret `
          --docker-server=https://index.docker.io/v1/ `
          --docker-username=${{ secrets.DOCKER_LOGIN }} `
          --docker-password=${{ secrets.DOCKER_PASSWORD }} `
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to Kubernetes cluster
      run: |
        kubectl apply -f k8s/deployment.yml
        kubectl apply -f k8s/service.yml
        kubectl set image deployment/<your-deployment-name> `
          <your-container-name>=${{ secrets.DOCKER_LOGIN }}/githubactions-aks-demo:${{ github.sha }}
        
    
        
    
